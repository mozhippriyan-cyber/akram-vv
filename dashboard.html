<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vocabulary Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== STYLES (keep your existing CSS – same as before) ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0B1E3D; --navy2: #122649; --gold: #F5A623;
    --sky: #0EA5E9; --muted: #64748B; --border: #E2E8F0;
    --bg: #F1F5FC; --white: #FFFFFF; --sidebar-w: 260px;
  }
  html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-w); background: var(--navy);
    display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
  }
  .sidebar-brand { padding: 1.5rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.07); display: flex; gap: 10px; align-items: center; }
  .sidebar-brand .icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), #e8951a); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .sidebar-brand .name { font-size: 15px; font-weight: 800; color: white; }
  .sidebar-brand .name span { color: var(--gold); }
  .sidebar-user { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.07); }
  .user-avatar { width: 42px; height: 42px; background: linear-gradient(135deg, var(--sky), #0284c7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; margin-bottom: 8px; }
  .user-name { font-size: 13.5px; font-weight: 700; color: white; }
  .lang-badge { background: rgba(245,166,35,.18); color: var(--gold); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-flex; gap: 4px; }
  .sidebar-nav { flex: 1; padding: 0 0.75rem; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,.65); cursor: pointer; }
  .nav-item.active { background: rgba(245,166,35,.15); color: var(--gold); }
  .sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,.07); }
  .btn-logout { width: 100%; padding: 9px; background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.2); border-radius: 8px; font-weight: 600; cursor: pointer; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .topbar { background: white; border-bottom: 1px solid var(--border); padding: 0.9rem 1.75rem; display: flex; justify-content: space-between; }
  .search-wrap { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 12px; max-width: 320px; }
  .search-wrap input { border: none; background: transparent; outline: none; width: 100%; }
  .content { flex: 1; overflow-y: auto; padding: 1.75rem; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .stat-card { background: white; border-radius: 12px; padding: 1.1rem 1.25rem; display: flex; align-items: center; gap: 12px; }
  .stat-ico { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .stat-ico.blue { background: #eff6ff; }
  .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--navy); }
  .section-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .video-card { background: white; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--border); transition: 0.2s; }
  .video-card.playing { border-color: var(--sky); }
  .thumb-wrap { position: relative; padding-top: 56.25%; background: var(--navy); }
  .thumb-wrap iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .thumb-overlay { position: absolute; inset:0; background: linear-gradient(135deg, #0B1E3D, #1a3fa8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
  .play-btn { width: 52px; height: 52px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
  .play-btn::after { content: '▶'; color: var(--navy); font-size: 18px; margin-left: 3px; }
  .vid-num { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.7); color: var(--gold); font-size: 10px; padding: 2px 8px; border-radius: 6px; }
  .card-body { padding: 12px 14px; }
  .card-title { font-size: 14px; font-weight: 700; }
  .empty-state { text-align: center; padding: 4rem; color: var(--muted); }
  .loading-state { display: flex; justify-content: center; padding: 4rem; gap: 12px; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--sky); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 768px) { .sidebar { position: fixed; left: -280px; z-index: 20; transition: left 0.25s; } .sidebar.open { left: 0; } .menu-btn { display: block; } }
  .menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
  .sidebar-overlay.show { display: block; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="icon">📘</div><div class="name">Vocabulary<br><span>Academy</span></div></div>
    <div class="sidebar-user"><div class="user-avatar" id="userAvatar">…</div><div class="user-name" id="userName">Loading…</div><div id="userLangBadge" class="lang-badge" style="margin-top:5px;"></div></div>
    <div class="sidebar-nav"><a class="nav-item active"><span>🎓</span> My Course</a></div>
    <div class="sidebar-footer"><button class="btn-logout" id="logoutBtn">🚪 Sign Out</button></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex; gap:10px;"><button class="menu-btn" id="menuBtn">☰</button><div class="topbar-title" id="topbarTitle">My Course</div></div>
      <div class="search-wrap" id="searchWrap" style="display:none"><span>🔍</span><input type="text" id="searchInput" placeholder="Search videos…"></div>
    </div>
    <div class="content" id="contentArea"><div class="loading-state"><div class="spinner"></div> Loading…</div></div>
  </div>
</div>

<script type="module">
import { app } from "./firebase-config.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const auth = getAuth(app);
const db = getFirestore(app);

// Helper: aggressively remove surrounding quotes and trim
function cleanString(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/^["']|["']$/g, '').trim();
}

// Mobile sidebar
document.getElementById('menuBtn').onclick = () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
};
document.getElementById('sidebarOverlay').onclick = () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
};
document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); window.location = 'login.html'; };

let currentPlayingId = null;
let allVideos = [];

function esc(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
function escAttr(str) { return str.replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location = 'login.html'; return; }

  // Fetch user data and clean fields
  const userDocRef = doc(db, 'users', user.uid);
  const userSnap = await getDoc(userDocRef);
  if (!userSnap.exists()) { renderError('User profile not found'); return; }
  const userData = userSnap.data();
  const name = cleanString(userData.name || userData.Name || 'Student');
  let lang = cleanString(userData.language || userData.Language || '');
  const status = cleanString(userData.status || userData.Status);

  const meta = { flag: '🌐', label: lang || 'Not assigned' };
  if (lang === 'American English') meta.flag = '🇺🇸';
  else if (lang === 'English') meta.flag = '🇺🇸';
  else if (lang === 'Hindi') meta.flag = '🇮🇳';
  else if (lang === 'Arabic') meta.flag = '🇸🇦';
  else if (lang === 'German') meta.flag = '🇩🇪';
  else if (lang === 'Mandarin') meta.flag = '🇨🇳';
  else if (lang === 'Japanese') meta.flag = '🇯🇵';
  else if (lang === 'French') meta.flag = '🇫🇷';
  meta.label = lang;

  document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('userName').textContent = name;
  document.getElementById('userLangBadge').textContent = meta.flag + ' ' + meta.label;
  document.getElementById('topbarTitle').textContent = name + "'s Course";

  if (status !== 'approved') {
    renderContent(`<div class="pending-card" style="text-align:center;padding:3rem;"><div class="pending-badge">Pending Approval</div><h2>Your account is under review</h2></div>`);
    return;
  }

  // ── Language routing — redirect to language-specific dashboard ──
  const langRoutes = {
    'Hindi': 'dashboard_hindi.html',
    // Add more as they are created:
    // 'Arabic': 'dashboard_arabic.html',
    // 'German': 'dashboard_german.html',
  };
  if (langRoutes[lang]) {
    window.location = langRoutes[lang];
    return;
  }

  document.getElementById('searchWrap').style.display = 'flex';
  if (!lang) { renderError('No language assigned. Contact support.'); return; }

  // Fetch ALL videos from 'videos' collection and clean every string field
  const videosSnapshot = await getDocs(collection(db, 'videos'));
  let allDocs = [];
  videosSnapshot.forEach(doc => {
    const data = doc.data();
    const cleaned = {
      id: doc.id,
      title: cleanString(data.title),
      language: cleanString(data.language),
      bunnySrc: cleanString(data.bunnySrc),
      category: cleanString(data.category || data.cat || ''),
      order: data.order
    };
    allDocs.push(cleaned);
  });
  console.log('Cleaned videos:', allDocs);

  // Filter by language (exact match after cleaning)
  let filtered = allDocs.filter(v => v.language === lang);
  
  // Fallback between English and American English
  if (filtered.length === 0 && lang === 'American English') {
    filtered = allDocs.filter(v => v.language === 'English');
  } else if (filtered.length === 0 && lang === 'English') {
    filtered = allDocs.filter(v => v.language === 'American English');
  }

  filtered.sort((a,b) => (a.order || 0) - (b.order || 0));
  allVideos = filtered;

  if (filtered.length === 0) {
    renderContent(`
      <div class="empty-state">
        <div class="ico">🔍</div>
        <h3>No videos for "${lang}"</h3>
        <p>Your Firestore document has language = "${allDocs[0]?.language || 'unknown'}" (after cleaning).</p>
        <p>Make sure your video document language field is exactly "${lang}" (no extra spaces or quotes).</p>
      </div>
    `);
    return;
  }

  renderDashboard(meta, filtered);
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filteredSearch = allVideos.filter(v => (v.title || '').toLowerCase().includes(q));
    renderVideoGrid(filteredSearch);
    document.getElementById('vidCount').innerText = filteredSearch.length + ' video' + (filteredSearch.length !== 1 ? 's' : '');
  });
});

function renderContent(html) { document.getElementById('contentArea').innerHTML = html; }
function renderError(msg) { renderContent(`<div class="empty-state"><div class="ico">⚠️</div><h3>${msg}</h3></div>`); }

function renderDashboard(meta, videos) {
  document.getElementById('contentArea').innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-ico blue">🎥</div><div><div class="stat-label">Total Videos</div><div class="stat-value">${videos.length}</div></div></div>
      <div class="stat-card"><div class="stat-ico gold">${meta.flag}</div><div><div class="stat-label">Your Language</div><div class="stat-value" style="font-size:1rem;">${meta.label}</div></div></div>
      <div class="stat-card"><div class="stat-ico green">✅</div><div><div class="stat-label">Status</div><div class="stat-value" style="font-size:1rem;color:#10B981;">Active</div></div></div>
    </div>
    <div class="section-header"><div class="section-title">${meta.flag} ${meta.label} Lessons <span class="count-pill" id="vidCount">${videos.length} videos</span></div></div>
    <div class="video-grid" id="videoGrid"></div>
  `;
  renderVideoGrid(videos);
}

function renderVideoGrid(videos) {
  const grid = document.getElementById('videoGrid');
  if (!grid) return;
  if (!videos.length) {
    grid.innerHTML = `<div class="empty-state"><div class="ico">📭</div><h3>No videos match your search</h3></div>`;
    return;
  }
  grid.innerHTML = videos.map((v, idx) => {
    const title = esc(v.title || 'Untitled');
    const order = v.order != null ? v.order : idx+1;
    let bunnySrc = v.bunnySrc || '';
    // Ensure the src is a valid URL (strip any leftover quotes)
    bunnySrc = bunnySrc.replace(/^"|"$/g, '');
    const vidId = v.id;
    return `
      <div class="video-card" id="vc-${vidId}" data-bunny-src="${escAttr(bunnySrc)}">
        <div class="thumb-wrap" id="tw-${vidId}">
          <div class="thumb-overlay" onclick="window.playVideo('${vidId}')">
            <button class="play-btn"></button><span class="thumb-label">Click to Play</span>
          </div>
          <div class="vid-num">#${String(order).padStart(3,'0')}</div>
        </div>
        <div class="card-body"><div class="card-title">${title}</div></div>
      </div>`;
  }).join('');
}

window.playVideo = function(videoId) {
  const card = document.getElementById(`vc-${videoId}`);
  if (!card) return;
  let bunnySrc = card.getAttribute('data-bunny-src');
  if (!bunnySrc) { alert('No video source'); return; }
  // Ensure autoplay parameter
  if (!bunnySrc.includes('autoplay')) {
    bunnySrc += (bunnySrc.includes('?') ? '&' : '?') + 'autoplay=true';
  }

  // Reset previous playing video
  if (currentPlayingId && currentPlayingId !== videoId) {
    const prevCard = document.getElementById(`vc-${currentPlayingId}`);
    if (prevCard) {
      const prevSrc = prevCard.getAttribute('data-bunny-src');
      const prevTw = document.getElementById(`tw-${currentPlayingId}`);
      if (prevTw) {
        const num = prevTw.querySelector('.vid-num')?.outerHTML || '';
        prevTw.innerHTML = `
          <div class="thumb-overlay" onclick="window.playVideo('${currentPlayingId}')">
            <button class="play-btn"></button><span class="thumb-label">Click to Play</span>
          </div>
          ${num}
        `;
      }
      prevCard.classList.remove('playing');
    }
  }

  const tw = document.getElementById(`tw-${videoId}`);
  const numHtml = tw.querySelector('.vid-num')?.outerHTML || '';
  tw.innerHTML = `
    <iframe src="${bunnySrc}" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"></iframe>
    ${numHtml}
  `;
  card.classList.add('playing');
  currentPlayingId = videoId;
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
</script>
</body>
</html>
