<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vocabulary Academy Dashboard</title>
    <style>
        /* Optional: simple responsive spacing */
        .video-container {
            margin-bottom: 2rem;
        }
        .video-title {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<h1>Vocabulary Academy</h1>

<p id="welcome">Loading...</p>
<p id="statusMessage"></p>

<button id="logoutBtn">Logout</button>

<hr>

<div id="content" style="display:none;">
    <h2>Your Language Course</h2>
    <p><strong>Language:</strong> <span id="language"></span></p>
    <div id="videos"></div>
</div>

<script type="module">
    import { app } from "./firebase-config.js";
    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        where
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location = "login.html";
            return;
        }

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
            alert("User profile not found.");
            return;
        }

        const data = userSnap.data();
        document.getElementById("welcome").textContent = "Welcome, " + data.name;

        if (data.status !== "approved") {
            document.getElementById("statusMessage").innerHTML = "<b>Your account is awaiting approval.</b>";
            return;
        }

        document.getElementById("content").style.display = "block";
        document.getElementById("language").textContent = data.language;

        // Fetch videos for the student's language
        const q = query(collection(db, "videos"), where("language", "==", data.language));
        const snapshot = await getDocs(q);

        let html = "";
        snapshot.forEach((doc) => {
            const v = doc.data();

            // Expect each video document to have:
            // - title (string)
            // - bunnySrc (string) = the embed URL from Bunny.net
            //   Example: "https://player.mediadelivery.net/embed/679120/85a6a0b7-28ba-4d84-a0b6-21c43c3b17eb?autoplay=true&loop=false&muted=true&preload=true&responsive=true"
            if (!v.bunnySrc) {
                console.warn("Missing bunnySrc for video:", v.title);
                return;
            }

            // Build a responsive Bunny.net player (16:9)
            html += `
                <div class="video-container">
                    <h3 class="video-title">${escapeHtml(v.title)}</h3>
                    <div style="position:relative;padding-top:56.25%;">
                        <iframe
                            src="${v.bunnySrc}"
                            loading="lazy"
                            style="border:0;position:absolute;top:0;height:100%;width:100%;"
                            allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;"
                            allowfullscreen="true">
                        </iframe>
                    </div>
                    <hr>
                </div>
            `;
        });

        if (html === "") {
            html = "<p>No videos found for your language yet.</p>";
        }
        document.getElementById("videos").innerHTML = html;
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
        window.location = "login.html";
    });

    // Simple helper to prevent XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === "&") return "&amp;";
            if (m === "<") return "&lt;";
            if (m === ">") return "&gt;";
            return m;
        });
    }
</script>

</body>
</html>
